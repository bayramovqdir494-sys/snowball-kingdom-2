<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snowball Kingdom 2</title>
<style>
@font-face{font-family:Lilita;src:url(assets/LilitaOne.ttf)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#9cc8ee;font-family:Lilita,'Arial Rounded MT Bold',sans-serif;color:#fff;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;pointer-events:none}
.scr{position:fixed;inset:0;display:none;pointer-events:none}
.scr.on{display:block}
.scr .pe,.pe{pointer-events:auto}
.t{text-shadow:0 .25vmin 0 #1d3a6a,0 0 1vmin rgba(20,40,90,.35);-webkit-text-stroke:.35vmin #1d3a6a;paint-order:stroke fill}
.btn{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:1vmin;border:0;border-radius:2.4vmin;padding:1.6vmin 3.6vmin;font:inherit;font-size:3.6vmin;color:#fff;cursor:pointer;
 background:linear-gradient(#5fd0ff,#2a8fe0);box-shadow:0 .8vmin 0 #1a5aa8,0 1.4vmin 2vmin rgba(0,30,80,.35),inset 0 .5vmin 0 rgba(255,255,255,.45);transition:transform .08s;position:relative}
.btn:active{transform:translateY(.6vmin);box-shadow:0 .2vmin 0 #1a5aa8,inset 0 .5vmin 0 rgba(255,255,255,.45)}
.btn.g{background:linear-gradient(#8ef06a,#3cb83a);box-shadow:0 .8vmin 0 #227a26,0 1.4vmin 2vmin rgba(0,40,0,.35),inset 0 .5vmin 0 rgba(255,255,255,.45)}
.btn.o{background:linear-gradient(#ffc94a,#ff8a1e);box-shadow:0 .8vmin 0 #b4520c,0 1.4vmin 2vmin rgba(60,20,0,.35),inset 0 .5vmin 0 rgba(255,255,255,.45)}
.btn.r{background:linear-gradient(#ff8a7a,#e8423a);box-shadow:0 .8vmin 0 #9a1f1a,0 1.4vmin 2vmin rgba(60,0,0,.35),inset 0 .5vmin 0 rgba(255,255,255,.45)}
.btn.p{background:linear-gradient(#c79bff,#8a4ae0);box-shadow:0 .8vmin 0 #5420a0,0 1.4vmin 2vmin rgba(30,0,60,.35),inset 0 .5vmin 0 rgba(255,255,255,.45)}
.btn.dis{filter:grayscale(.8) brightness(.85);}
.btn img{height:4.6vmin}
.btn.big{font-size:6vmin;padding:2vmin 7vmin;border-radius:3.5vmin}
.ico{height:4vmin;vertical-align:middle}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;background:linear-gradient(#f4fbff,#d6ecff);border-radius:4vmin;padding:4vmin;
 box-shadow:0 1.2vmin 0 #8fb6dc,0 2vmin 6vmin rgba(10,40,90,.45),inset 0 .6vmin 0 #fff;color:#24477a;text-align:center;max-width:94vw;max-height:94vh;overflow:auto}
.panel h2{margin:0 0 2vmin;font-size:6vmin;font-weight:normal;color:#fff}
.dim{position:absolute;inset:0;background:rgba(20,40,80,.35);pointer-events:auto}
#coins{position:fixed;top:2vmin;right:2vmin;display:none;align-items:center;gap:1vmin;font-size:4.6vmin;background:rgba(20,50,100,.45);padding:.6vmin 2.6vmin .6vmin 1vmin;border-radius:5vmin;z-index:30;pointer-events:none}
#coins img{height:6vmin}
/* menu */
#logo{position:absolute;left:50%;top:3vmin;transform:translateX(-50%);width:min(78vw,96vmin);filter:drop-shadow(0 1.2vmin 1vmin rgba(10,40,90,.35))}
#menuBtns{position:absolute;left:50%;bottom:5vmin;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2.6vmin}
#menuRow{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center}
.badge{position:absolute;top:-1.2vmin;right:-1.2vmin;background:#ff3a3a;border-radius:50%;width:3.6vmin;height:3.6vmin;font-size:2.4vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 .3vmin 0 #900}
/* build */
#buildTop{position:absolute;top:2vmin;left:50%;transform:translateX(-50%);text-align:center}
#buildTop .h{font-size:5vmin}
#budget{display:inline-flex;align-items:center;gap:1vmin;font-size:5vmin;background:rgba(20,50,100,.45);padding:.4vmin 2.6vmin .4vmin 1vmin;border-radius:5vmin;margin-top:1vmin}
#budget img{height:6vmin}
#cards{position:absolute;bottom:2.4vmin;left:50%;transform:translateX(-50%);display:flex;gap:1.6vmin}
.card{pointer-events:auto;width:16vmin;background:linear-gradient(#ffffff,#d8ecff);border-radius:2.6vmin;padding:1vmin;text-align:center;color:#24477a;box-shadow:0 .8vmin 0 #7ea6d0,0 1.2vmin 2vmin rgba(0,30,80,.3);cursor:pointer;position:relative;transition:transform .1s}
.card img{width:12vmin;height:12vmin;object-fit:contain;display:block;margin:0 auto}
.card .n{font-size:2.8vmin}.card .c{position:absolute;top:.6vmin;right:.8vmin;font-size:3vmin;color:#2a8fe0;display:flex;align-items:center}
.card .c img{width:3.4vmin;height:3.4vmin}
.card .newb{position:absolute;top:-1.6vmin;left:-1vmin;background:#ff5a3a;color:#fff;font-size:2.4vmin;padding:.3vmin 1vmin;border-radius:1.2vmin;transform:rotate(-8deg);box-shadow:0 .4vmin 0 #b0301a;animation:newb 1s ease-in-out infinite alternate}@keyframes newb{to{transform:rotate(-8deg) scale(1.12)}}
.card.sel{transform:translateY(-1.6vmin) scale(1.06);box-shadow:0 .8vmin 0 #2a8fe0,0 0 0 .7vmin #5fd0ff,0 2vmin 3vmin rgba(0,30,80,.4)}
.card.no{filter:grayscale(.7) opacity(.7)}
#buildSide{position:absolute;right:2.4vmin;bottom:2.4vmin;display:flex;flex-direction:column;gap:2vmin;align-items:flex-end}
#buildLeft{position:absolute;left:2.4vmin;bottom:2.4vmin;display:flex;flex-direction:column;gap:2vmin}
#hint{position:absolute;left:50%;top:22vmin;transform:translateX(-50%);font-size:4vmin;background:rgba(20,50,100,.55);padding:1.2vmin 3vmin;border-radius:3vmin;white-space:nowrap;display:none;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-1vmin)}}
/* hud */
#hp{position:absolute;top:2vmin;left:2vmin;display:flex;gap:.4vmin}
#hp img{height:6.4vmin;transition:transform .2s}
#hp img.lost{filter:grayscale(1) opacity(.45);transform:scale(.8)}
#foes{position:absolute;top:2vmin;left:50%;transform:translateX(-50%);display:flex;gap:1.4vmin}
.foe{position:relative;width:8.6vmin;text-align:center}
.foe img{width:8.6vmin;height:8.6vmin;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:0 .4vmin 0 rgba(20,50,100,.5)}
.foe .bar{height:1.2vmin;border-radius:1vmin;background:rgba(20,40,80,.5);margin-top:.4vmin;overflow:hidden}
.foe .bar i{display:block;height:100%;background:linear-gradient(#ff8a7a,#e8423a);transition:width .2s}
.foe.out img{filter:grayscale(1) brightness(.7)}
.foe.out::after{content:'';position:absolute;left:10%;top:40%;width:80%;height:1vmin;background:#e8423a;transform:rotate(-30deg);border-radius:1vmin}
#pauseB{position:absolute;top:2vmin;right:2vmin}
#balls{position:absolute;right:2.4vmin;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:1.4vmin}
.bb{pointer-events:auto;width:11vmin;height:11vmin;border-radius:50%;background:radial-gradient(#ffffff,#cfe6ff);box-shadow:0 .6vmin 0 #7ea6d0,0 1vmin 2vmin rgba(0,30,80,.3);position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bb img{width:9vmin;height:9vmin}
.bb .k{position:absolute;bottom:-1vmin;right:-1vmin;background:#2a8fe0;border-radius:3vmin;min-width:4.4vmin;font-size:2.8vmin;padding:.2vmin 1vmin;box-shadow:0 .3vmin 0 #1a5aa8}
.bb.sel{box-shadow:0 .6vmin 0 #ff8a1e,0 0 0 .8vmin #ffc94a,0 1vmin 2vmin rgba(0,30,80,.3);transform:scale(1.08)}
.bb.empty{filter:grayscale(1) opacity(.5)}
.tc{pointer-events:auto;position:absolute;bottom:3vmin;width:17vmin;height:17vmin;border-radius:50%;background:rgba(255,255,255,.28);border:.6vmin solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;box-shadow:0 .6vmin 1.4vmin rgba(0,30,80,.25)}
.tc img{width:11vmin}
.tc.on{background:rgba(95,208,255,.55)}
#tl{left:3vmin}#tr{left:23vmin}#td{right:3vmin;width:19vmin;height:19vmin}
#keys{position:absolute;bottom:2vmin;left:50%;transform:translateX(-50%);font-size:2.6vmin;opacity:.85;white-space:nowrap}
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:13vmin;pointer-events:none;opacity:0;white-space:nowrap;z-index:20}
#banner.show{animation:ban var(--d,1.2s) ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}12%{opacity:1;transform:translate(-50%,-50%) scale(.92)}20%{transform:translate(-50%,-50%) scale(1.04)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
#banner.win{color:#ffe14a}#banner.go{color:#8ef06a}
#pops{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:5vmin;white-space:nowrap;animation:pop 1s ease-out forwards}
.pop.bonk{color:#ffe14a;font-size:7vmin}.pop.out{color:#ff6a5a;font-size:7.5vmin}.pop.smash{color:#9fe0ff;font-size:6vmin}.pop.dmg{color:#fff}.pop.coin{font-size:3.6vmin;color:#ffd84a}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-80%) scale(1.25);opacity:1}30%{transform:translate(-50%,-90%) scale(1)}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
#combo{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-size:7vmin;color:#ffc94a;pointer-events:none;opacity:0;z-index:16}
#combo.show{animation:cmb .9s ease-out}
@keyframes cmb{0%{opacity:0;transform:translateX(-50%) scale(.4) rotate(-8deg)}20%{opacity:1;transform:translateX(-50%) scale(1.2) rotate(3deg)}80%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0}}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 18vmin rgba(255,40,40,.0);transition:box-shadow .4s;z-index:14}
#hurt.on{box-shadow:inset 0 0 18vmin rgba(255,40,40,.65);transition:none}
/* results */
.stars{display:flex;justify-content:center;gap:2vmin;margin:1vmin 0 2vmin}
.stars img{height:14vmin;opacity:0;transform:scale(2.5)}
.stars img.in{animation:sin .45s cubic-bezier(.3,1.6,.6,1) forwards}
.stars img.mid{height:17vmin;margin-top:-2vmin}
@keyframes sin{to{opacity:1;transform:scale(1)}}
.rrow{display:flex;justify-content:space-between;font-size:3.6vmin;gap:6vmin;margin:.6vmin 0;color:#24477a}
.rrow b{font-weight:normal;color:#e8862a}
.btns{display:flex;gap:2vmin;justify-content:center;margin-top:3vmin;flex-wrap:wrap}
.goal{font-size:3vmin;color:#5a7aa8;display:flex;align-items:center;justify-content:center;gap:1vmin}
.goal img{height:3.6vmin}
/* levels */
#lvWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;padding:12vmin 2vmin 4vmin}
#seasons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.4vmin;pointer-events:auto}
.season{background:linear-gradient(#ffffff,#d6ecff);border-radius:3vmin;padding:1.6vmin 2vmin 2vmin;color:#24477a;box-shadow:0 .8vmin 0 #7ea6d0,0 1.4vmin 2.4vmin rgba(0,30,80,.3);min-width:40vmin;position:relative;overflow:hidden}
.season .sh{font-size:4vmin;display:flex;justify-content:space-between;align-items:center;gap:2vmin}
.season .sh span{font-size:3vmin;color:#5a7aa8;display:flex;align-items:center;gap:.6vmin}.season .sh span img{height:3.6vmin}
.season .thumb{width:100%;height:13vmin;object-fit:cover;border-radius:2vmin;margin:1vmin 0;display:block}
.lvls{display:flex;gap:1.2vmin;justify-content:center}
.lv{width:7.4vmin;height:8.6vmin;border-radius:2vmin;background:linear-gradient(#5fd0ff,#2a8fe0);box-shadow:0 .6vmin 0 #1a5aa8;color:#fff;font-size:3.8vmin;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto}
.lv .s{display:flex}.lv .s img{height:2.2vmin}
.lv.lock{background:linear-gradient(#b8c8dc,#8aa0bc);box-shadow:0 .6vmin 0 #5a7090}
.lv.boss{background:linear-gradient(#ffc94a,#ff8a1e);box-shadow:0 .6vmin 0 #b4520c}
.season.locked .lvls,.season.locked .thumb{filter:grayscale(.8) brightness(.8)}
.season .lockc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1vmin;font-size:5vmin;background:rgba(30,60,110,.35);color:#fff}
.season .lockc img{height:8vmin}
.back{position:absolute;top:2vmin;left:2vmin}
/* shop */
#shopP{width:min(96vw,150vmin)}
.tabs{display:flex;gap:1.4vmin;justify-content:center;margin-bottom:2vmin}
.tab{pointer-events:auto;padding:1vmin 3vmin;border-radius:2vmin;background:#b8d4f0;color:#24477a;font-size:3.4vmin;cursor:pointer}
.tab.on{background:#2a8fe0;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(26vmin,1fr));gap:1.6vmin}
.item{background:#fff;border-radius:2.4vmin;padding:1.4vmin;box-shadow:0 .5vmin 0 #9fc0e0;display:flex;flex-direction:column;align-items:center;gap:.6vmin;font-size:3vmin}
.item img.pic{height:11vmin}
.item .d{font-size:2.3vmin;color:#5a7aa8}
.item .lvlp{display:flex;gap:.5vmin}.item .lvlp i{width:2.6vmin;height:1.4vmin;border-radius:.6vmin;background:#cfe0f0}.item .lvlp i.f{background:#3cb83a}
.item .btn{font-size:2.8vmin;padding:1vmin 2.4vmin}
.item .btn img{height:3.2vmin}
.sw{width:11vmin;height:11vmin;border-radius:50%;border:.8vmin solid #fff;box-shadow:0 .4vmin 1vmin rgba(0,0,0,.3)}
/* daily */
#dayGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1.2vmin;margin:2vmin 0}
.day{background:#fff;border-radius:2vmin;padding:1vmin .6vmin;font-size:2.6vmin;box-shadow:0 .4vmin 0 #9fc0e0;display:flex;flex-direction:column;align-items:center;gap:.4vmin;min-width:11vmin}
.day img{height:7vmin}
.day.got{opacity:.5}.day.now{box-shadow:0 .4vmin 0 #ff8a1e,0 0 0 .6vmin #ffc94a;transform:scale(1.06)}
/* settings */
.srow{display:flex;align-items:center;justify-content:space-between;gap:4vmin;font-size:3.6vmin;margin:1.6vmin 0}
.seg{display:flex;gap:.8vmin}.seg .tab{font-size:3vmin}
#loading{position:fixed;inset:0;background:linear-gradient(#8fc4f0,#e8f4ff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vmin;z-index:50;transition:opacity .4s}
#loading img{width:min(80vw,90vmin)}
#lbar{width:50vmin;height:3vmin;border-radius:2vmin;background:rgba(20,60,120,.25);overflow:hidden;box-shadow:inset 0 .3vmin 0 rgba(0,0,0,.15)}
#lbar i{display:block;height:100%;width:0;background:linear-gradient(#ffffff,#bfe4ff);border-radius:2vmin;transition:width .2s}
@media (orientation:portrait){
 #cards{bottom:3vmin;flex-wrap:wrap;justify-content:center;width:96vw}.card{width:21vmin}.card img{width:15vmin;height:15vmin}
 #buildSide{bottom:auto;top:27vmin;right:2vmin}#buildLeft{bottom:auto;top:27vmin;left:2vmin}
 #balls{top:auto;bottom:26vmin;transform:none;flex-direction:row;right:50%;transform:translateX(50%)}
 .bb{width:12vmin;height:12vmin}
 .tc{width:20vmin;height:20vmin;bottom:4vmin}#tr{left:26vmin}#td{width:22vmin;height:22vmin}
 #foes{top:11vmin}.foe{width:9.6vmin}.foe img{width:9.6vmin;height:9.6vmin}
 #seasons{grid-template-columns:1fr}.season{min-width:80vw}
 #logo{top:12vmin;width:92vw}
 #banner{font-size:15vmin}
 #menuBtns{bottom:8vmin}
}

.chal,.ach{display:flex;align-items:center;gap:1.6vmin;background:#fff;border-radius:2vmin;padding:1.2vmin 1.8vmin;box-shadow:0 .5vmin 0 #9fc0e0;font-size:2.5vmin;color:#4a6a98;text-align:left}
.chal{background:linear-gradient(90deg,#fff6d8,#fff);margin:0 0 1.6vmin}.chal.done,.ach.got{background:linear-gradient(90deg,#dcf8d4,#fff)}
.chal>img,.ach>img{height:7vmin;flex:none}.chal>div:nth-child(2),.ach>div:nth-child(2){flex:1}.chal b,.ach b{font-size:3vmin;color:#2a4a80}
.rew{font-size:3vmin;color:#e8a020;display:flex;align-items:center;gap:.5vmin;flex:none}.rew img{height:3.6vmin}
.prog{color:#e8a020;font-weight:bold}.bar{height:1.2vmin;border-radius:1vmin;background:#dfeaf6;margin-top:.6vmin;overflow:hidden}.bar i{display:block;height:100%;background:#4cc04a}
#achGrid{display:grid;grid-template-columns:1fr 1fr;gap:1.2vmin;max-height:52vh;overflow-y:auto;padding:.4vmin}
@media (orientation:portrait){#achGrid{grid-template-columns:1fr}}
.toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:rgba(20,50,100,.85);color:#fff;font-size:3.4vmin;padding:1.2vmin 3vmin;border-radius:3vmin;display:flex;align-items:center;gap:1.2vmin;z-index:50;pointer-events:none;animation:tin .35s ease-out;transition:opacity .5s,transform .5s}
.toast img{height:5vmin}.toast.out{opacity:0;transform:translate(-50%,-2vmin)}
@keyframes tin{from{transform:translate(-50%,-4vmin);opacity:0}}

#sk2intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;transition:opacity .55s}
#sk2intro.out{opacity:0;pointer-events:none}
#sk2intro .sk2bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(160,215,255,.55),rgba(20,50,110,.88));backdrop-filter:blur(3px)}
#sk2intro .sk2c{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3vmin}
#sk2intro .sk2l{width:min(88vw,120vmin);filter:drop-shadow(0 1.5vmin 2vmin rgba(0,20,60,.5));animation:sk2in 1.1s cubic-bezier(.2,1.6,.4,1) both}
#sk2intro .sk2s{font-size:4.2vmin;opacity:.95;animation:sk2f .8s .6s both}
#sk2intro .sk2p{font-size:5.6vmin;animation:sk2f .6s 1s both,sk2pu 1.1s 1.6s ease-in-out infinite}
@keyframes sk2in{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes sk2f{from{opacity:0;transform:translateY(2vmin)}}
@keyframes sk2pu{50%{transform:scale(1.08)}}
#sk2hud{position:absolute;inset:0;pointer-events:none}
#sk2m{position:absolute;top:13.5vmin;left:50%;transform:translateX(-50%);font-size:3.6vmin;background:rgba(20,50,100,.5);padding:.6vmin 2.4vmin;border-radius:2.4vmin;white-space:nowrap}
#sk2m:empty,#sk2a:empty{display:none}
#sk2b{position:absolute;top:11vmin;right:2vmin;display:flex;flex-direction:column;gap:1vmin;align-items:flex-end}
#sk2b div{font-size:2.8vmin;padding:.5vmin 1.8vmin;border-radius:2vmin;color:#fff;text-shadow:0 .2vmin 0 rgba(0,0,0,.5);box-shadow:0 .4vmin 0 rgba(0,0,0,.25)}
#sk2w{position:absolute;left:2vmin;top:12vmin;padding:1vmin 2vmin;font-size:3vmin}
#sk2w img{height:5vmin}
#sk2a{position:absolute;bottom:22vmin;left:50%;transform:translateX(-50%);font-size:3.4vmin;background:rgba(20,50,100,.5);padding:.6vmin 2.4vmin;border-radius:2.4vmin;white-space:nowrap}
@media (orientation:portrait){#sk2m{top:12vmin;font-size:3.2vmin}#sk2w{top:auto;bottom:30vmin}#sk2a{bottom:34vmin;font-size:3vmin}}
</style></head><body>
<div id="loading"><img src="assets/ui/logo.webp" alt="Snowball Kingdom"><div id="lbar"><i></i></div></div>
<div id="coins"><img src="assets/ui/coin.webp"><span>0</span></div>
<div id="ui" class="layer"></div>
<div id="pops"></div><div id="banner" class="t"></div><div id="combo" class="t"></div><div id="hurt"></div>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<script src="game.js"></script>
</body></html>
